<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>老爸老媽自由行｜2/23–3/04</title>
  <style>
    :root{
      --bg:#0b0c10; --card:#12141b; --muted:#9aa3b2; --text:#eef2ff;
      --line:#232738; --accent:#7dd3fc; --accent2:#a7f3d0; --chip:#1a1f2f;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:linear-gradient(180deg,#0b0c10,#0f1220);color:var(--text)}
    header{position:sticky;top:0;z-index:10;background:rgba(11,12,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:980px;margin:0 auto;padding:14px}
    h1{margin:6px 0 2px;font-size:18px}
    .sub{margin:0;color:var(--muted);font-size:12px;line-height:1.4}
    .tabs{display:flex;gap:8px;overflow:auto;padding:10px 14px 12px}
    .tab{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 10px;border-radius:999px;font-size:12px;cursor:pointer}
    .tab.active{background:rgba(125,211,252,.12);border-color:rgba(125,211,252,.35)}
    main{padding:14px 14px 80px}
    .day{margin:18px auto 26px;max-width:980px}
    .day h2{font-size:16px;margin:0 0 10px}
    .meta{color:var(--muted);font-size:12px;margin:0 0 12px;line-height:1.5}
    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media (min-width:880px){.grid{grid-template-columns:1fr 1fr}}
    .card{background:rgba(18,20,27,.92);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .img{aspect-ratio:16/9;background:#111;overflow:hidden}
    .img img{width:100%;height:100%;object-fit:cover;display:block}
    .content{padding:12px 12px 14px}
    .title{display:flex;gap:8px;align-items:flex-start}
    .title h3{margin:0;font-size:15px;line-height:1.25}
    .badge{margin-top:2px;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--muted)}
    .desc{margin:8px 0 10px;color:#d8deea;font-size:13px;line-height:1.55}
    .row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
    a.btn{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--text);border:1px solid var(--line);background:rgba(255,255,255,.02);padding:8px 10px;border-radius:12px;font-size:12px}
    a.btn.primary{border-color:rgba(125,211,252,.4);background:rgba(125,211,252,.10)}
    a.btn.good{border-color:rgba(167,243,208,.35);background:rgba(167,243,208,.10)}
    .chipline{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .chip{font-size:12px;color:var(--muted);border:1px dashed rgba(154,163,178,.35);padding:6px 10px;border-radius:999px}
    details{border-top:1px solid var(--line);padding-top:10px}
    summary{cursor:pointer;color:var(--accent);font-size:13px;list-style:none}
    summary::-webkit-details-marker{display:none}
    .info{margin:10px 0 0;color:#d8deea;font-size:13px;line-height:1.65}
    .foot{position:fixed;left:0;right:0;bottom:0;background:rgba(11,12,16,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
    .foot .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .smallbtn{border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 10px;border-radius:12px;font-size:12px}
  </style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>老爸老媽自由行｜2/23–3/04（手機可點、長輩好懂）</h1>
    <p class="sub">每站：圖片＋導航＋搭車步驟＋建議時間＋餐廳 Tabelog 連結。</p>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main id="app"></main>

<div class="foot">
  <div class="wrap">
    <div style="font-size:12px;color:var(--muted)">點「導航到搭車點」→ 跟著藍點走到入口 → 看現場指標。</div>
    <button class="smallbtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">回到最上面</button>
  </div>
</div>

<script>
const gm = (q)=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
// 圖片來源改用 Wikimedia Redirect（自動導到正確檔案路徑，最穩）
const wm = (file)=>`https://commons.wikimedia.org/wiki/Special:Redirect/file/${encodeURIComponent(file)}?width=1600`;

const data=[
{
 id:"d226",
 title:"2/26（四）名古屋→小倉（帶2大行李）＋燒肉",
 note:"JR Pass、新幹線最後一排劃位、JR Station Hotel Kokura 直結動線。",
 cards:[
 {
  place:"名古屋 → 小倉（新幹線）",
  badge:"移動重點",
  img:wm("3/3a/Shinkansen_N700A_series.jpg"),
  imgSource:"Wikimedia",
  map:gm("JR Nagoya Station"),
  board:gm("Nagoya Station Taiko-dori Exit"),
  go:"08:30 到名古屋站",
  stay:"約2小時50分",
  back:"中午抵達小倉",
  view:"入口走太閤通口，全程找電梯符號。",
  ride:[
   "JR Pass到みどりの窓口劃位",
   "要求最後一排（oversized baggage）",
   "行李>160cm需超大行李座位",
   "小倉下車找新幹線口→Hotel指標"
  ]
 },
 {
  place:"焼肉の龍園 小倉本店",
  badge:"燒肉",
  img:wm("6/64/Yakiniku.jpg"),
  imgSource:"Wikimedia",
  map:gm("焼肉の龍園 小倉本店"),
  board:gm("Kokura Station"),
  tabelog:"https://tabelog.com/fukuoka/A4004/A400401/40001673/",
  go:"19:00",
  stay:"1.5小時",
  back:"回飯店",
  view:"黑毛和牛，重口味很有爽感。",
  ride:["計程車8–10分鐘"]
 }
 ]
}
];

const tabs=document.getElementById("tabs");
const app=document.getElementById("app");

function render(id){
 tabs.innerHTML=data.map(d=>`<button class="tab ${d.id===id?'active':''}" onclick="render('${d.id}')">${d.title}</button>`).join('');
 const day=data.find(d=>d.id===id);
 app.innerHTML=`<section class="day"><h2>${day.title}</h2><p class="meta">${day.note}</p><div class="grid">${day.cards.map(card).join('')}</div></section>`;
}

function card(c){
 return `<article class="card">
 <div class=\"img\"><img src=\"${c.img}\" alt=\"${c.place}\" loading=\"lazy\" referrerpolicy=\"no-referrer\"><\/div>
 <div class="content">
 <div class="title"><h3>${c.place}</h3><span class="badge">${c.badge||''}</span></div>
 <div class="desc">${c.view||''}</div>
 <div class="chipline">
 <span class="chip">出發：${c.go||''}</span>
 <span class="chip">停留：${c.stay||''}</span>
 <span class="chip">回程：${c.back||''}</span>
 </div>
 <div class=\"row\">
 <a class=\"btn primary\" href=\"${c.map}\" target=\"_blank\">導航到景點</a>
 <a class=\"btn good\" href=\"${c.board}\" target=\"_blank\">導航到搭車點</a>
 ${c.tabelog?`<a class=\"btn\" href=\"${c.tabelog}\" target=\"_blank\">Tabelog</a>`:''}
 <a class=\"btn\" href=\"${c.img}\" target=\"_blank\">開圖片</a>
 </div>
 <details><summary>搭車方式</summary><div class="info">${(c.ride||[]).map(x=>'• '+x).join('<br>')}</div></details>
 </div></article>`;
}

render(data[0].id);
</script>
</body>
</html>
