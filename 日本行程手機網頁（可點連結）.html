  <style>
    :root{
      --bg:#0b0c10; --card:#12141b; --muted:#9aa3b2; --text:#eef2ff;
      --line:#232738; --accent:#7dd3fc; --accent2:#a7f3d0;
      --chip:#1a1f2f;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:linear-gradient(180deg,#0b0c10,#0f1220);color:var(--text)}
    header{position:sticky;top:0;z-index:10;background:rgba(11,12,16,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .wrap{max-width:980px;margin:0 auto;padding:14px 14px}
    h1{margin:6px 0 2px;font-size:18px;letter-spacing:.2px}
    .sub{margin:0;color:var(--muted);font-size:12px;line-height:1.4}

    .tabs{display:flex;gap:8px;overflow:auto;padding:10px 14px 12px}
    .tab{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--text);padding:8px 10px;border-radius:999px;font-size:12px}
    .tab.active{background:rgba(125,211,252,.12);border-color:rgba(125,211,252,.35)}

    main{padding:14px 14px 80px}
    .day{margin:18px auto 26px;max-width:980px}
    .day h2{font-size:16px;margin:0 0 10px}
    .meta{color:var(--muted);font-size:12px;margin:0 0 12px;line-height:1.5}

    .grid{display:grid;grid-template-columns:1fr;gap:12px}
    @media (min-width:880px){.grid{grid-template-columns:1fr 1fr}}

    .card{background:rgba(18,20,27,.92);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .img{aspect-ratio:16/9;background:#0a0a0a;overflow:hidden}
    .img img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05)}
    .content{padding:12px 12px 14px}
    .title{display:flex;gap:8px;align-items:flex-start}
    .title h3{margin:0;font-size:15px;line-height:1.25}
    .badge{margin-top:2px;font-size:11px;padding:3px 8px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--muted)}
    .desc{margin:8px 0 10px;color:#d8deea;font-size:13px;line-height:1.55}

    .row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 10px}
    a.btn{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--text);border:1px solid var(--line);background:rgba(255,255,255,.02);padding:8px 10px;border-radius:12px;font-size:12px}
    a.btn.primary{border-color:rgba(125,211,252,.4);background:rgba(125,211,252,.10)}
    a.btn.good{border-color:rgba(167,243,208,.35);background:rgba(167,243,208,.10)}

    details{border-top:1px solid var(--line);padding-top:10px}
    summary{cursor:pointer;color:var(--accent);font-size:13px;list-style:none}
    summary::-webkit-details-marker{display:none}
    .info{margin:10px 0 0;color:#d8deea;font-size:13px;line-height:1.65}
    .chipline{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .chip{font-size:12px;color:var(--muted);border:1px dashed rgba(154,163,178,.35);padding:6px 10px;border-radius:999px}

    .foot{position:fixed;left:0;right:0;bottom:0;background:rgba(11,12,16,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
    .foot .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between}
    .hint{font-size:12px;color:var(--muted);line-height:1.4}
    .smallbtn{border:1px solid var(--line);background:transparent;color:var(--text);padding:9px 10px;border-radius:12px;font-size:12px}
  </style>
</head>

            "起點：西鐵『福岡（天神）站（Nishitetsu Fukuoka / Tenjin）』。",
            "搭乘：西鐵天神大牟田線，往『西鐵柳川站（Nishitetsu Yanagawa）』，約 50 分鐘。",
            "到站後：步行或短程計程車到乘船處（依你選的乘船公司集合點為準）。"
          ]
        }
      ]
    },

    {
      id:"d302",
      title:"3/02（一）福岡｜大濠公園＋天神購物",
      note:"主題：湖畔步道乾淨舒服；購物日讓爸媽可以隨時回飯店休息。",
      cards:[
        {
          place:"大濠公園（湖畔散步）",
          badge:"舒適散步",
          img: wm("Ohori_Park%2C_Fukuoka.JPG"),
          imgSource:"Wikimedia Commons",
          map: gm("Ohori Park") ,
          board: gm("Ohori Koen Station") ,
          go:"09:30 抵達（早上空氣最好）",
          stay:"停留 1.5–2 小時",
          back:"12:00 左右回天神午餐/購物",
          view:"湖中心步道繞一圈很舒服，走累了就找咖啡坐下來看水面。",
          ride:[
            "從天神：搭福岡地下鐵到『大濠公園站（Ohori Koen）』。",
            "出站後步行幾分鐘就到湖邊。"
          ]
        }
      ]
    },

    {
      id:"d303",
      title:"3/03（二）福岡｜海之中道海濱公園（花田＋小火車）",
      note:"主題：超大自然公園，適合用『電動腳踏車或園內小火車』降低步行量。",
      cards:[
        {
          place:"海之中道海濱公園",
          badge:"花田",
          img: wm("Park_Train_in_Uminonakamichi_Seaside_Park.jpg"),
          imgSource:"Wikimedia Commons",
          map: gm("Uminonakamichi Seaside Park") ,
          board: gm("Uminonakamichi Station") ,
          go:"09:30 從市區出發",
          stay:"停留 3–4 小時",
          back:"15:30–16:00 回天神",
          view:"春季花田＋海風，園內小火車超加分；長輩不用硬走。",
          ride:[
            "建議到站：JR『海之中道站（Uminonakamichi Station）』步行即可到入口。",
            "市區前往方式很多：以『天神 →（地鐵）→ 轉 JR』的路線最常見。",
            "提醒：依你當天住宿點，Google 地圖用『大眾運輸』模式會給最省轉乘的即時路線。"
          ]
        }
      ]
    },

    {
      id:"d304",
      title:"3/04（三）回程｜天神 → 福岡機場",
      note:"主題：吃完最後一頓好料，用『計程車 15 分鐘』把風險降到最低。",
      cards:[
        {
          place:"天神 → 福岡機場（建議計程車）",
          badge:"返家",
          img: "https://upload.wikimedia.org/wikipedia/commons/4/4e/Fukuoka_Airport_International_Terminal_2019.jpg",
          imgSource:"Wikipedia/Wikimedia",
          map: gm("Fukuoka Airport") ,
          board: gm("Tenjin Fukuoka") ,
          go:"依班機時間倒推：起飛前 2 小時到機場較安心",
          stay:"—",
          back:"—",
          view:"用計程車把轉乘壓力歸零，長輩心情會很好（也比較不會把氣出在你身上）。",
          ride:[
            "從天神搭計程車到福岡機場：車程約 15–20 分鐘（視交通）。",
            "若改搭地鐵：天神站可直達福岡機場站，但帶長輩＋行李時計程車最省心。"
          ]
        }
      ]

  ];

  const tabs = document.getElementById('tabs');
  const app = document.getElementById('app');

  function render(activeId){
    tabs.innerHTML = data.map(d=>{
      const cls = d.id===activeId?"tab active":"tab";
      return `<button class="${cls}" onclick="setDay('${d.id}')">${d.title.split('｜')[0]}</button>`;
    }).join('');

    const day = data.find(d=>d.id===activeId) || data[0];
    app.innerHTML = `
      <section class="day">
        <h2>${day.title}</h2>
        <p class="meta">${day.note}</p>
        <div class="grid">
          ${day.cards.map(c=>cardHtml(c)).join('')}
        </div>
      </section>
    `;
  }

  function cardHtml(c){
    const flow = (c.flow||[]);
    const flowHtml = flow.length ? `
      <div style="margin:10px 0 6px">
        <div style="color:var(--muted);font-size:12px;margin:0 0 8px">搭車圖解（照這個順序走）</div>
        <div style="display:flex;align-items:center;gap:8px;overflow:auto;padding-bottom:6px">
          ${flow.map((s,i)=>`
            <div style="display:flex;align-items:center;gap:8px;white-space:nowrap">
              <div style="display:flex;align-items:center;gap:8px">
                <div style="width:22px;height:22px;border-radius:999px;background:rgba(125,211,252,.12);border:1px solid rgba(125,211,252,.35);display:flex;align-items:center;justify-content:center;font-size:12px">${i+1}</div>
                <div style="font-size:12px;color:#d8deea">${escapeHtml(s)}</div>
              </div>
              ${i===flow.length-1?"":"<div style='color:rgba(154,163,178,.6)'>→</div>"}
            </div>
          `).join('')}
        </div>
      </div>
    ` : '';

    const navs = (c.navs||[]);
    // navs: [{label, to, mode, from?}]
    const navHtml = navs.length ? `
      <div class="row" style="margin-top:10px">
        ${navs.map(n=>`
          <a class="btn" href="${gdir({from:n.from, to:n.to, mode:n.mode||'transit'})}" target="_blank" rel="noopener">${escapeHtml(n.label)}</a>
        `).join('')}
      </div>
      <div style="color:var(--muted);font-size:12px;margin-top:2px;line-height:1.5">
        提醒：如果你在車站內迷路，直接點「導航到搭車點」，跟著藍色點走到入口，再看現場指示牌。
      </div>
    ` : '';

    return `
    <article class="card">
      <div class="img">
        <img src="${c.img}" alt="${escapeHtml(c.place)}" loading="lazy" referrerpolicy="no-referrer" />
      </div>
      <div class="content">
        <div class="title">
          <h3>${escapeHtml(c.place)}</h3>
          <span class="badge">${escapeHtml(c.badge||"")}</span>
        </div>
        <div class="desc">${escapeHtml(c.view||"")}</div>

        <div class="chipline">
          <span class="chip">建議出發：${escapeHtml(c.go||"—")}</span>
          <span class="chip">停留：${escapeHtml(c.stay||"—")}</span>
          <span class="chip">回程：${escapeHtml(c.back||"—")}</span>
        </div>

        <div class="row" style="margin-top:12px">
          <a class="btn primary" href="${c.map}" target="_blank" rel="noopener">導航到景點</a>
          <a class="btn good" href="${c.board}" target="_blank" rel="noopener">導航到搭車點</a>
          <a class="btn" href="${c.map}&travelmode=transit" target="_blank" rel="noopener">看大眾運輸路線</a>
        </div>

        ${flowHtml}
        ${navHtml}

        <details>
          <summary>搭車方式（一步一步）</summary>
          <div class="info">
            ${ (c.ride||[]).map(x=>`• ${escapeHtml(x)}`).join('<br/>') }
            <div style="margin-top:10px;color:var(--muted);font-size:12px">
              圖片來源：${escapeHtml(c.imgSource||"")}（僅作為視覺參考）。
            </div>
          </div>
        </details>
      </div>
    </article>`;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, (m)=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
  }

  window.setDay = (id)=>{
    history.replaceState(null,"",`#${id}`);
    render(id);
  };

  const initial = location.hash?.replace('#','') || data[0].id;
  render(data.some(d=>d.id===initial)?initial:data[0].id);
</script>
